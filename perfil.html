<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Perfil — PanCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="shell">
    <header class="site">
      <a href="index.html" class="logo">
        <span class="name">PanCM</span>
        <span class="tag">Desarrollo de software</span>
      </a>
      <nav class="main">
        <a href="proyectos.html">Proyectos</a>
        <a href="equipo.html">Equipo</a>
        <a href="nosotros.html">Metodología</a>
        <a href="contacto.html" class="cta">Contacto</a>
      </nav>
    </header>

    <main>
      <section style="padding:56px var(--gutter) 32px;border-bottom:1px solid var(--border)">
        <a href="equipo.html" class="back-link">← Equipo</a>
        <div class="profile-head">
          <div class="who">
            <img data-profile-avatar class="profile-avatar" src="" alt="" />
            <div>
              <h1 data-profile-nombre></h1>
              <p class="profile-role" data-profile-rol></p>
            </div>
          </div>
          <div class="profile-cta">
            <a href="#" class="primary">Descargar CV en PDF</a>
            <a href="contacto.html" class="secondary">Contactar</a>
          </div>
        </div>
        <p class="profile-bio" data-profile-bio></p>
      </section>

      <section class="profile-grid">
        <div>
          <div class="panel-label">Experiencia</div>
          <div data-profile-experiencia></div>
        </div>
        <div>
          <div class="panel-label">Herramientas</div>
          <div class="stack-tags" data-profile-stack></div>
          <div class="panel-label spaced">Contacto</div>
          <div class="datos-list" data-profile-datos></div>
          <a href="#" data-profile-linkedin class="linkedin-link" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </section>

      <section style="padding:0 var(--gutter) 64px">
        <div class="panel-label">Aporte en proyectos</div>
        <a href="proyecto.html" class="what-did">
          <span>
            <span class="title">Centro de Psicología Clínica</span>
            <span class="aporte" data-profile-aporte></span>
          </span>
          <span class="year">2026 →</span>
        </a>
      </section>
    </main>

    <footer class="site">
      <span>PanCM · Desarrollo de software · Chile</span>
      <span>hola@pancm.cl</span>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
